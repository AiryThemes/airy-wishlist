name: CI

# Runs on every pull request and on pushes to main.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP_CodeSniffer + WordPress Coding Standards
        run: |
          composer global require --no-interaction --no-progress \
            "squizlabs/php_codesniffer:^3.9" \
            "wp-coding-standards/wpcs:^3.1" \
            "phpcsstandards/phpcsextra:^1.2" \
            "phpcsstandards/phpcsutils:^1.0" \
            "dealerdirect/phpcodesniffer-composer-installer:^1.0"

      - name: Run PHPCS (uses phpcs.xml.dist in repo root)
        run: ~/.composer/vendor/bin/phpcs -q --report=full

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
